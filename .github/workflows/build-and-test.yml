name: Build and Test

on:
  pull_request:
  push:
    branches:
      - main
      - staging

jobs:
  lint:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: SwiftLint
        run: make lint

  build-and-test:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4.0'

      - name: Resolve Swift packages
        run: swift package resolve

      - name: Run unit tests (SPM on iOS Simulator)
        run: make test

  spm-integration:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4.0'

      # Verifies a downstream SwiftPM consumer can resolve + compile against AEPFlags.
      - name: SPM integration build
        run: make test-SPM-integration
